# AI Berkshire 주간 리밸런싱 퀀트 — 설정
# 8섹터 가치·퀄리티 점수가중 (Phase 1)

# ── 팩터 가중 (가치 50 : 퀄리티 50 — Phase 2.1 다레짐 백테스트로 확정) ──
# 6.5년(2020~2026, 코로나·2022약세장·2023반도체적자 포함) 검증 결과:
# 가치·퀄리티 틸트가 수익·Sharpe(1.81)·하락방어(2022 −7%) 모두 우월.
# Phase 2.5의 모멘텀 우위는 2024~26 불장 과적합이었음 → 모멘텀 제거.
weights:
  quality: 0.5
  value: 0.5
  momentum: 0.0

# 퀄리티 팩터 (높을수록 좋음; debt_ratio는 코드에서 부호 반전)
quality_factors: [roe, op_margin, net_margin, debt_ratio]
# 가치 팩터 (백테스트 검증과 동일 — earnings_yield·book_yield만 점수화)
# 컨센 상승여력(upside)·배당은 표시만 하고 점수엔 미반영(과거 검증 불가·노이즈)
value_factors: [earnings_yield, book_yield]
# 모멘텀: 점수 미반영(weight 0). 표시·실험용으로만 계산.
momentum_factors: []
mom_lookback_weeks: 26

# ── 하드 스크린 (통과해야 랭킹 대상) ─────────────────────────
screen:
  require_positive_net_income: true   # 최근 회계연도 당기순이익 > 0 (적자 제외)
  require_positive_per: true          # EPS>0 (PER 산출 가능)
  min_trading_value_eok: 30           # 최근 거래대금 최소 30억원 (유동성)

# ── 선별·비중 ────────────────────────────────────────────────
selection:
  top_per_sector: 2        # 섹터별 상위 N
  max_names: 12            # 최종 포트 최대 종목수
  max_weight: 0.15         # 종목당 비중 상한
  max_sector_weight: 0.30  # 섹터당 비중 상한

# ── 주간 리밸런싱 (Phase 3) ──────────────────────────────────
rebalance:
  band: 0.03               # 목표대비 ±3%p 벗어날 때만 거래(회전율·비용 절감)
  default_cash: 100000000  # portfolio.yaml 없을 때 가정 자본(원)

# ── 백테스트 (Phase 2) ───────────────────────────────────────
backtest:
  start: "2024-04-01"      # FY2023 실적 공시 이후(룩어헤드 방지)
  end: "2026-06-27"
  reporting_lag_days: 90   # 회계연도말 + 90일 후부터 해당 재무 사용
  rebalance: "W-FRI"       # 주간(금요일 종가)
  # 과거 재구성 가능한 가치팩터만 사용(컨센 상승여력·배당은 과거 시점 확보 불가 → 제외)
  value_factors: [earnings_yield, book_yield]
  cost:
    commission: 0.00015    # 수수료(편도)
    slippage: 0.001        # 슬리피지(편도)
    sell_tax: 0.0018       # 매도 거래세(보수적 가정)
  benchmarks:
    "069500": "KODEX200"
    "229200": "KODEX코스닥150"
  # 장기·다레짐(DART 재무) 백테스트 — 2022 둔화·2023 반도체 적자 포함
  long_start: "2020-01-03"
  price_history_start: "2019-06-01"

